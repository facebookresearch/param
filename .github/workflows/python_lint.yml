name: Python Linting

on: pull_request

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v2

    - name: Setup Python Environment
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install black
    # OpenSource Black seems not match Meta internal version
    # temporarily disable it until we figure out how to make
    # them consistent
    # - name: Run Black
    #  run: black . --check

    - name: Run tests
      run: |
        python -m pip install -r requirements.txt
        # et_replay/pyproject.toml is laid out for meta-pytorch/chakra_replay,
        # where it sits one level above the et_replay package. Install from a
        # copy staged in that layout.
        mkdir "$RUNNER_TEMP/et_replay_pkg"
        cp et_replay/pyproject.toml "$RUNNER_TEMP/et_replay_pkg/"
        cp -r et_replay "$RUNNER_TEMP/et_replay_pkg/et_replay"
        python -m pip install "$RUNNER_TEMP/et_replay_pkg"
        python et_replay/tests/test_execution_trace.py

    - name: Validate imports
      run: |
        python -m pip install fbgemm-gpu
        python -c 'from et_replay.execution_trace import ExecutionTrace'
        python -c 'from et_replay.comm import comms_utils'
        python -c 'from et_replay.tools.validate_trace import TraceValidator'
        python -c 'from et_replay.utils import trace_handler'
